<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dialogos Selector</title>
</head>
<body>
  <h1>Choose a Graph</h1>
  <div id="graph-buttons"></div>

  <script>
    function generateUserId() {
      return 'user-' + Math.floor(Math.random() * 100000);
    }

    function loadGraph(graphName) {
      const userId = generateUserId();
      window.location.href = `/communication.html?userId=${encodeURIComponent(userId)}&graphName=${encodeURIComponent(graphName)}`;
    }

    //Dynamicall fetch the names
    fetch('/inf.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('graph-buttons');
        const docs = data.Documents;
        console.log(docs)
        Object.keys(docs).forEach(graphName => {
          const button = document.createElement('button');
          button.textContent = graphName.charAt(0).toUpperCase() + graphName.slice(1);
          button.onclick = () => loadGraph(graphName);
          container.appendChild(button);
        });
      })
      .catch(err => console.error('Failed to load graph list:', err));
  </script>
</body>
</html>
