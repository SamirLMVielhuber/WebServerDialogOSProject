<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dialogos Selector</title>
</head>
<body>
  <h1>Choose a Graph</h1>

  <button onclick="loadGraph('test')">Test</button>
  <button onclick="loadGraph('greeting')">Greeting</button>
  <button onclick="loadGraph('advanced')">Advanced</button>

  <script>
    function generateUserId() {
      // Simple random userId, can be more complex
      return 'user-' + Math.floor(Math.random() * 100000);
    }

    //This now only does redirection the calling of the DialogLoadServlet is now done in the communication.html
    function loadGraph(graphName) {
      const userId = generateUserId();
      window.location.href = `/communication.html?userId=${encodeURIComponent(userId)}&graphName=${encodeURIComponent(graphName)}`;
    }
  </script>
</body>
</html>
